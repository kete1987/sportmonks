name: Release dry run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-app:
    if: github.ref == 'refs/heads/master' && github.actor == 'kete1987' && github.triggering_actor == 'kete1987'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: maven-central
    steps:
      - name: Verify the release app installation
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

  verify-central:
    if: github.ref == 'refs/heads/master' && github.actor == 'kete1987' && github.triggering_actor == 'kete1987'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check the Sonatype token for this component
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import http.client
          import json
          import os
          import urllib.parse
          import xml.etree.ElementTree as ET

          username = os.environ["MAVEN_CENTRAL_USERNAME"]
          password = os.environ["MAVEN_CENTRAL_PASSWORD"]
          if not username or not password:
              raise SystemExit("Maven Central credentials are missing")
          token = base64.b64encode(f"{username}:{password}".encode()).decode()
          pom = ET.parse("pom.xml")
          coordinates = urllib.parse.urlencode({
              "namespace": pom.findtext("{*}groupId"),
              "name": pom.findtext("{*}artifactId"),
              "version": pom.findtext("{*}version").removesuffix("-SNAPSHOT"),
          })
          portal = http.client.HTTPSConnection("central.sonatype.com", timeout=20)
          try:
              path = "/api/v1/publisher/published?" + coordinates
              portal.request("GET", path, headers={"Authorization": f"Bearer {token}", "User-Agent": "Maven release dry run (GitHub Actions)"})
              response = portal.getresponse()
              if response.status != 200:
                  raise SystemExit(f"Sonatype component check returned HTTP {response.status}")
              result = json.load(response)
          finally:
              portal.close()
          if type(result.get("published")) is not bool:
              raise SystemExit("Sonatype did not report whether the component was published")
          print(f"Sonatype accepted the token for this component. Already published: {result['published']}.")
          PY

  build-bundle:
    if: github.ref == 'refs/heads/master' && github.actor == 'kete1987' && github.triggering_actor == 'kete1987'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: maven-central
    env:
      SIGNING_FINGERPRINT: '9DFD461DE07A17E2BC7EABB9F5471BBC816471A5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: '11'
          server-id: central
          server-username-env-var: DRY_RUN_USERNAME
          server-password-env-var: DRY_RUN_SECRET

      - name: Build and verify the signed bundle
        shell: bash
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          DRY_RUN_USERNAME: dry-run
          DRY_RUN_SECRET: dry-run
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pom = Path("pom.xml")
          original = pom.read_text(encoding="utf-8")
          modified, changes = re.subn(
              r"(?m)^    <version>([0-9]+\.[0-9]+\.[0-9]+)-SNAPSHOT</version>$",
              r"    <version>\1-dry-run</version>",
              original,
              count=1,
          )
          if changes != 1:
              raise SystemExit("Expected the project version to end in -SNAPSHOT")
          pom.write_text(modified, encoding="utf-8")
          PY

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          trap 'rm -rf -- "$GNUPGHOME"' EXIT
          test -n "$MAVEN_GPG_KEY"
          test -n "$MAVEN_GPG_PASSPHRASE"
          curl --silent --show-error --fail --max-time 20 --retry 2 \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$SIGNING_FINGERPRINT" \
            | gpg --batch --import

          mvn --batch-mode --no-transfer-progress clean deploy \
            -Dgpg.signer=bc -Dgpg.bestPractices=true -Dmaven.install.skip=true \
            -DskipUpload=true -DcentralBaseUrl=http://127.0.0.1:1 \
            -DcentralSnapshotsUrl=http://127.0.0.1:1

          test -s target/central-publishing/central-bundle.zip
          unzip -q target/central-publishing/central-bundle.zip -d target/bundle-verification
          mapfile -d '' signatures < <(find target/bundle-verification -name '*.asc' -print0)
          test "${#signatures[@]}" -eq 4
          for signature in "${signatures[@]}"; do
            artifact="${signature%.asc}"
            gpg --batch --status-fd 1 --verify "$signature" "$artifact" \
              | grep -F "[GNUPG:] VALIDSIG $SIGNING_FINGERPRINT " >/dev/null
            hash="$(sha256sum "$artifact")"
            test "${hash%% *}" = "$(cat "$artifact.sha256")"
          done
          printf '%s\n' 'Built the Maven Central bundle and verified all four release-key signatures and SHA-256 checksums.' >> "$GITHUB_STEP_SUMMARY"
