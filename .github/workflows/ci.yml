name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v6
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn test --batch-mode

      - name: Test release automation
        run: |
          python3 -m venv "$RUNNER_TEMP/release-tests"
          "$RUNNER_TEMP/release-tests/bin/python" -m pip --disable-pip-version-check install "coverage==7.17.4"
          "$RUNNER_TEMP/release-tests/bin/python" -m coverage run --branch --include='.github/scripts/release.py' -m unittest discover -s src/test/python
          "$RUNNER_TEMP/release-tests/bin/python" -m coverage xml -o target/release-coverage.xml

      - name: Publish test results
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: JUnit Tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar --batch-mode
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.projectKey=kete1987_sportmonks
          -Dsonar.organization=kete1987
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.tests=src/test/java,src/test/python
          -Dsonar.python.coverage.reportPaths=target/release-coverage.xml
