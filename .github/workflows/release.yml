name: Maven release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release (X.Y.Z)
        required: true
        type: string
      next_version:
        description: Next development version (X.Y.Z, without -SNAPSHOT)
        required: true
        type: string
      mode:
        description: Check readiness or publish
        type: choice
        options: [check, publish]
        default: check
      deployment_id:
        description: Recover an existing Central deployment if its ID was not recorded
        type: string
      retry_upload:
        description: Retry a failed upload after checking the Central Portal
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: maven-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master' && github.actor == 'kete1987' && github.triggering_actor == 'kete1987'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: maven-central
    env:
      RELEASE_MODE: ${{ inputs.mode }}
      RELEASE_VERSION: ${{ inputs.version }}
      NEXT_VERSION: ${{ inputs.next_version }}
      RECOVERY_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      RETRY_UPLOAD: ${{ inputs.retry_upload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check versions and publication status
        env:
          GH_TOKEN: ${{ github.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 .github/scripts/release.py check

      - name: Authenticate as the release App
        if: inputs.mode == 'publish'
        id: release-app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the release version PR
        if: inputs.mode == 'publish'
        id: candidate
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          APP_SLUG: ${{ steps.release-app.outputs.app-slug }}
        run: |
          test "$APP_SLUG" = 'imoralesalo-bot'
          python3 .github/scripts/release.py prepare

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.candidate.outputs.bundle == 'true'
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          path: candidate
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        if: steps.candidate.outputs.bundle == 'true'
        with:
          distribution: temurin
          java-version: '11'
          server-id: central
          server-username-env-var: BUNDLE_PLACEHOLDER
          server-password-env-var: BUNDLE_PLACEHOLDER

      - name: Test and sign the exact release commit
        if: steps.candidate.outputs.bundle == 'true'
        working-directory: candidate
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          BUNDLE_PLACEHOLDER: local-bundle
        run: |
          test -n "$MAVEN_GPG_KEY"
          test -n "$MAVEN_GPG_PASSPHRASE"
          mvn --batch-mode --no-transfer-progress clean deploy \
            -Dgpg.signer=bc -Dgpg.bestPractices=true -Dmaven.install.skip=true \
            -DskipUpload=true -DcentralBaseUrl=http://127.0.0.1:1 \
            -DcentralSnapshotsUrl=http://127.0.0.1:1

      - name: Upload, validate and publish in Maven Central
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: python3 .github/scripts/release.py publish

      - name: Create the GitHub release and merge the next SNAPSHOT PR
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
        run: python3 .github/scripts/release.py finish
